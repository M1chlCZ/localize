<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>localize demo</title>
<style>
:root{color-scheme:light}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f6f8;color:#1f2933;font-family:system-ui,sans-serif;padding:24px}
main{width:100%;max-width:640px;background:#fff;border:1px solid #d5d9de;border-radius:16px;padding:32px;box-shadow:0 10px 30px rgba(15,23,42,.06)}
header{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:20px}
nav button{border:1px solid #cbd2d9;background:#fff;border-radius:999px;padding:6px 14px;font:inherit;cursor:pointer}
nav button[aria-pressed="true"]{background:#1f2933;color:#fff;border-color:#1f2933}
h1{margin:0 0 12px;font-size:26px}
p{line-height:1.6;color:#3e4c59}
.cart{display:flex;align-items:center;gap:12px;margin:20px 0;padding:12px 16px;background:#f4f6f8;border-radius:12px}
.cart button{border:0;background:#1f2933;color:#fff;border-radius:999px;width:32px;height:32px;font:inherit;cursor:pointer}
.fallback{font-size:13px;color:#697586}
footer{margin-top:24px;padding-top:16px;border-top:1px solid #e3e7eb;font-size:13px;color:#697586}
</style>
</head>
<body>
<main>
<header>
  <strong>localize</strong>
  <nav>
    <button type="button" data-locale="en-GB" aria-pressed="false">English</button>
    <button type="button" data-locale="de-DE" aria-pressed="false">Deutsch</button>
  </nav>
</header>
<h1 data-message="page.heading"></h1>
<p data-message="page.intro"></p>
<div class="cart">
  <button type="button" id="add">+</button>
  <span data-message="cart.items" data-count="0"></span>
</div>
<p class="fallback" data-message="help.text"></p>
<footer data-message="footer.note"></footer>
</main>
<script type="module">
const messages = new Map();
let locale = "en-GB";
let count = 0;

async function load(code) {
  const response = await fetch(`arb/${code}.arb`);
  return response.json();
}

function translate(key) {
  return messages.get(locale)[key].replaceAll("{count}", String(count));
}

function render() {
  document.documentElement.lang = locale === "de-DE" ? "de" : "en";
  document.title = translate("page.title");
  for (const element of document.querySelectorAll("[data-message]")) {
    element.textContent = translate(element.dataset.message);
  }
  for (const button of document.querySelectorAll("nav button")) {
    button.setAttribute("aria-pressed", String(button.dataset.locale === locale));
  }
}

document.getElementById("add").addEventListener("click", () => {
  count += 1;
  render();
});

for (const button of document.querySelectorAll("nav button")) {
  button.addEventListener("click", () => {
    locale = button.dataset.locale;
    render();
  });
}

for (const code of ["en-GB", "de-DE"]) {
  messages.set(code, await load(code));
}
render();
</script>
</body>
</html>
